# Aula 15: antes estava "always". Hoje TODO erro sai pelo ApiExceptionHandler (ErroDTO),
# e a página de erro padrão do Spring não deve mostrar a mensagem da exceção: ela pode
# trazer SQL, nome de tabela e de classe. Detalhe de erro vai para o LOG, não para o cliente.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Informa ao Spring o endereço JDBC do banco PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5444/tarefas
# Informa o usuário usado para abrir a conexão com o banco.
spring.datasource.username=tarefas
# Aula 15: a senha vem da variável DB_SENHA. O "tarefas" depois dos dois-pontos é só o
# padrão de AULA, para o projeto subir sem configurar nada. Em produção: sem padrão.
spring.datasource.password=${DB_SENHA:tarefas}

# Pede ao Hibernate apenas para validar o schema, sem criar ou alterar tabelas.
spring.jpa.hibernate.ddl-auto=validate
# Mostra no console o SQL que o Repository dispara por meio do Hibernate.
# Aula 15: desligado. Em produção, SQL no console é ruído e expõe a estrutura das tabelas.
# Para estudar as consultas, ligue na sua máquina: SPRING_JPA_SHOW_SQL=true
spring.jpa.show-sql=false
# Evita manter uma sessão JPA aberta durante toda a requisição web.
spring.jpa.open-in-view=false

# Liga a execução automática das migrations no startup da aplicação.
spring.flyway.enabled=true

# ---------------------------------------------------------------- Swagger (Aula 09)
# O springdoc já funciona sem nenhuma linha aqui; estas só deixam o padrão explícito.
# Endereço do contrato OpenAPI em JSON -- é este arquivo que o Postman importa.
springdoc.api-docs.path=/v3/api-docs
# Endereço da página do Swagger UI (redireciona para /swagger-ui/index.html).
springdoc.swagger-ui.path=/swagger-ui.html
# Sem esta linha, o Swagger mostra as respostas como "*/*"; a API só devolve JSON.
springdoc.default-produces-media-type=application/json
# Abre cada endpoint já no modo "Try it out", pronto para enviar a requisição.
springdoc.swagger-ui.try-it-out-enabled=true
# Mostra quanto tempo cada requisição feita pelo Swagger UI levou.
springdoc.swagger-ui.display-request-duration=true
# Ordena os grupos (tags) e, dentro deles, os endpoints pelo método HTTP.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# ---------------------------------------------------------------- Previsão do tempo (Aula 12)
# Endereço da API de previsão do tempo que a nossa API consome (OpenMeteoClient).
# O Open-Meteo é gratuito e não pede cadastro nem chave de acesso.
previsao.url=https://api.open-meteo.com

# Quanto tempo esperar para CONECTAR no Open-Meteo antes de desistir.
spring.http.client.connect-timeout=2s
# Depois de conectado, quanto tempo esperar pela RESPOSTA.
# Sem estas duas linhas, uma chamada a um serviço travado fica esperando por
# minutos (ou para sempre), e a requisição de quem chamou a NOSSA API junto.
spring.http.client.read-timeout=5s

# ---------------------------------------------------------------- RabbitMQ (Aula 12)
# Endereço e credenciais do broker (docker-compose.yml, serviço "rabbitmq").
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5675
spring.rabbitmq.username=tarefas
spring.rabbitmq.password=tarefas
# Se a mensagem falhar no consumidor, não fica reenfileirando para sempre.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Não derruba a API se o RabbitMQ estiver fora do ar na hora de subir.
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# ---------------------------------------------------------------- Observabilidade (Aula 13)
# Quais endpoints do Actuator ficam expostos pela web. O padrão é só "health".
# Aula 15: só o que é usado. "health" para o Docker e "prometheus" para o Prometheus.
# (metrics e info saíram: quanto menos porta aberta, menos coisa para proteger.)
management.endpoints.web.exposure.include=health,prometheus
# Aula 15: os detalhes (banco, RabbitMQ, disco, versões) só para quem tem token.
# Sem token, o /actuator/health responde só {"status":"UP"}.
management.endpoint.health.show-details=when-authorized
# Etiqueta toda métrica com o nome da aplicação (para filtrar no Prometheus/Grafana).
management.metrics.tags.application=exemplo-tarefas
# Gera histograma por rota HTTP, para o Grafana calcular percentis (p95, p99).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Dá um nome à aplicação (aparece nos logs e nas métricas).
spring.application.name=exemplo-tarefas
# Cada linha de log carrega o id da requisição (veja RequisicaoIdFilter), para seguir uma
# requisição pelos logs do começo ao fim.
logging.pattern.level=%5p [%X{requisicaoId:-}]

# ---------------------------------------------------------------------------
# Aula 14: servidor MCP (Model Context Protocol)
# ---------------------------------------------------------------------------
# Nome e versão que o servidor informa ao cliente de IA no "aperto de mão" (initialize).
spring.ai.mcp.server.name=tarefas
spring.ai.mcp.server.version=1.0.0
# Transporte Streamable HTTP: tudo passa por UMA rota, POST /mcp, na mesma porta 8080 da API.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# SYNC: os métodos das ferramentas são Java comum (sem Mono/Flux).
spring.ai.mcp.server.type=SYNC
# Texto que o cliente de IA recebe junto com a lista de ferramentas: uma "dica de uso" do servidor.
spring.ai.mcp.server.instructions=Sistema de tarefas da disciplina de Backend. Datas no formato yyyy-MM-dd. Antes de cadastrar, confira as regras no recurso tarefas://regras.

# ---------------------------------------------------------------------------
# Aula 14: assistente da tela (assistente.html)
# ---------------------------------------------------------------------------
# Servidor de modelos no formato "chat completions". Padrão: o Ollama do
# docker-compose (docker compose --profile ia up -d), que roda o modelo na
# própria máquina e NÃO precisa de chave.
# Cada linha pode ser trocada por variável de ambiente (ASSISTENTE_URL,
# ASSISTENTE_CHAVE, ASSISTENTE_MODELO). Para usar o OpenRouter, por exemplo:
#   ASSISTENTE_URL=https://openrouter.ai/api/v1
#   ASSISTENTE_CHAVE=sk-or-...        (nunca escreva a chave neste arquivo)
#   ASSISTENTE_MODELO=google/gemma-4-31b-it:free
assistente.url=http://localhost:11434/v1
assistente.chave=
assistente.modelo=qwen2.5:3b
# Quantas vezes seguidas o modelo pode pedir ferramentas antes de responder.
assistente.max-rodadas=6

# ---------------------------------------------------------------------------
# Aula 15: autenticação e segurança
# ---------------------------------------------------------------------------
# A chave que ASSINA os tokens JWT (pelo menos 32 caracteres). Vem SEMPRE de
# variável de ambiente (ou do .env, que não vai para o Git). Vazia = a aplicação
# sorteia uma chave a cada subida (bom para aula; os tokens caem ao reiniciar).
seguranca.jwt.segredo=${JWT_SEGREDO:}
# Validade do token de acesso. Curta: um token roubado vale pouco tempo.
seguranca.jwt.validade=30m
# Validade do "desafio" entre a senha e o código do aplicativo.
seguranca.jwt.validade-desafio=5m
# Custo do BCrypt: 2^12 rodadas, cerca de 0,2 s por senha.
seguranca.bcrypt.custo=12
# Força bruta: 5 erros seguidos bloqueiam a conta por 15 minutos.
seguranca.login.max-tentativas=5
seguranca.login.bloqueio=15m
# Limite do tamanho das requisições: o Tomcat recusa corpos de formulário maiores
# (o @Size dos DTOs cuida dos campos de texto no JSON).
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=64KB

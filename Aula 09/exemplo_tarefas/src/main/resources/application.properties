# Sem isso, o 400 do @Valid vem sem "message"/"errors" -- só timestamp/status/path.
# Ligado aqui pra página em static/index.html mostrar a mensagem de validação de verdade.
# Inclui a mensagem da exceção na resposta de erro do Spring.
server.error.include-message=always
# Inclui os detalhes dos erros de validação na resposta HTTP.
server.error.include-binding-errors=always

# Informa ao Spring o endereço JDBC do banco PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5435/tarefas
# Informa o usuário usado para abrir a conexão com o banco.
spring.datasource.username=tarefas
# Informa a senha usada para abrir a conexão com o banco.
spring.datasource.password=tarefas

# Pede ao Hibernate apenas para validar o schema, sem criar ou alterar tabelas.
spring.jpa.hibernate.ddl-auto=validate
# Mostra no console o SQL que o Repository dispara por meio do Hibernate.
spring.jpa.show-sql=true
# Evita manter uma sessão JPA aberta durante toda a requisição web.
spring.jpa.open-in-view=false

# Liga a execução automática das migrations no startup da aplicação.
spring.flyway.enabled=true

# ---------------------------------------------------------------- Swagger (Aula 09)
# O springdoc já funciona sem nenhuma linha aqui; estas só deixam o padrão explícito.
# Endereço do contrato OpenAPI em JSON -- é este arquivo que o Postman importa.
springdoc.api-docs.path=/v3/api-docs
# Endereço da página do Swagger UI (redireciona para /swagger-ui/index.html).
springdoc.swagger-ui.path=/swagger-ui.html
# Sem esta linha, o Swagger mostra as respostas como "*/*"; a API só devolve JSON.
springdoc.default-produces-media-type=application/json
# Abre cada endpoint já no modo "Try it out", pronto para enviar a requisição.
springdoc.swagger-ui.try-it-out-enabled=true
# Mostra quanto tempo cada requisição feita pelo Swagger UI levou.
springdoc.swagger-ui.display-request-duration=true
# Ordena os grupos (tags) e, dentro deles, os endpoints pelo método HTTP.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

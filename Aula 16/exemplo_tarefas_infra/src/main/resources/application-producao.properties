# Aula 16: o perfil de PRODUÇÃO.
#
# Este arquivo só vale quando o perfil "producao" está ligado:
#     SPRING_PROFILES_ACTIVE=producao     (no Compose: PERFIL=producao no .env)
# O que está aqui VENCE o application.properties; o resto continua valendo.
#
# A ideia (uma das regras do "The Twelve-Factor App"): o MESMO .jar, a mesma imagem,
# roda em todo lugar. O que muda de um ambiente para outro é só a CONFIGURAÇÃO,
# e a configuração vem de variáveis de ambiente, nunca de uma imagem diferente.

# Sem valor padrão: se JWT_SEGREDO ou DB_SENHA não existirem, a API NÃO SOBE
# ("Could not resolve placeholder"). Melhor não subir do que subir com a chave
# de aula, que está num repositório público.
seguranca.jwt.segredo=${JWT_SEGREDO}
# E se a variável existir, mas VAZIA (o Compose faz isso com "${JWT_SEGREDO:-}"),
# a API também se recusa a subir, em vez de sortear uma chave (SegurancaConfig).
seguranca.jwt.exigir-segredo=true
spring.datasource.password=${DB_SENHA}

# O Swagger é ótimo para estudar, mas em produção mostra o mapa inteiro da API
# para qualquer visitante. Desligado.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logs em JSON (uma linha = um objeto): fáceis de buscar e filtrar em ferramentas
# como Loki, Elasticsearch ou CloudWatch. Para ler na tela, o formato de texto é melhor.
logging.structured.format.console=ecs
